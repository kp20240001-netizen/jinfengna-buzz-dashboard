name: Auto-Build Jinfengna War Room Static Pages

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard_data.json'
      - 'premiere_reviews_data.json'
      - 'export_static_site.py'
      - 'update_premiere_reviews.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile static war-room pages (docs/)
        run: |
          python3 export_static_site.py
          python3 update_premiere_reviews.py

      - name: Commit and push updated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/dashboard.js docs/premiere_24h_reviews.html premiere_24h_reviews.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(war-room): auto-compile static pages from JSON update [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes in compiled static pages."
          fi
